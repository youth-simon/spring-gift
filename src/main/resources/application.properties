spring.application.name=spring-gift

# H2 in-memory
spring.datasource.url=jdbc:h2:mem:spring-gift;MODE=MYSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA (Flyway owns schema; Hibernate only validates)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Kakao OAuth (override via env: KAKAO_LOGIN_CLIENT_ID, KAKAO_LOGIN_CLIENT_SECRET)
kakao.login.client-id=${KAKAO_LOGIN_CLIENT_ID:dummy-client-id}
kakao.login.client-secret=${KAKAO_LOGIN_CLIENT_SECRET:}
kakao.login.redirect-uri=${KAKAO_LOGIN_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}

# JWT (override via env: AUTH_JWT_SECRET)
auth.jwt.secret=${AUTH_JWT_SECRET:change-this-in-production-it-must-be-long-enough}
auth.jwt.expiry=PT2H
